[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Material-Screening-and-Catalyst-Deactivation-Rate-Analysis-using-ML"
version = "1.0.0"
authors = [
  { name="Aditya001-max", email="kaushikadityaraj001@gmail.com" },
]
description = "Material Screening and Catalyst Deactivation Rate Analysis using Physics-Informed Machine Learning (PINN)"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
"Homepage" = "https://github.com/Aditya001-max"
"Bug Tracker" = "https://github.com/Aditya001-max"
